<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ビジュアライザー</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000; --fg: #fff; --muted: #ccc; --panel: rgba(0,0,0,0.65); --track: #555; --thumb: #fff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; height: 100%; width: 100%; background: var(--bg); color: var(--fg);
    overflow: hidden; font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
  #panel { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    z-index: 10; width: 90%; max-width: 600px; box-sizing: border-box; max-height: 80%; overflow-y: auto;
    background: var(--panel); padding: 10px 14px; border-radius: 8px; }
  #panelHead { display: flex; align-items: center; justify-content: space-between; }
  h2 { font-size: 16px; margin: 0; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; z-index: 1; }
  #embedWrap { position: fixed; top: 0; left: 0; z-index: 0; display: none; border-radius: 50%; overflow: hidden;
    clip-path: circle(50% at 50% 50%); pointer-events: none; transform-origin: center; background: #000; }
  #embedFrame { position: absolute; left: 50%; top: 50%; width: 640px; height: 360px; border: 0; pointer-events: none; transform-origin: center; }
  #media { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  label { font-size: 14px; display: block; color: var(--muted); margin-top: 8px; }
  input[type="file"] { max-width: 100%; margin-top: 8px; }
  input[type="range"] { width: 100%; margin: 6px 0; -webkit-appearance: none; appearance: none; background: transparent; height: 24px; cursor: pointer; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--track); border-radius: 2px; }
  input[type="range"]::-moz-range-track { height: 4px; background: var(--track); border-radius: 2px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--thumb); margin-top: -6px; }
  input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--thumb); }
  button, select { font-size: 16px; padding: 6px 12px; margin-top: 8px; cursor: pointer; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row button { margin-top: 8px; }
  #timeDisplay, #status { margin-top: 2px; font-size: 14px; color: var(--muted); }
  .hidden { display: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webm-muxer@5.0.3/build/webm-muxer.js"></script>
</head>
<body>
<div id="panel">
  <div id="panelHead">
    <h2>ビジュアライザー＋円内画像</h2>
    <button id="togglePanel" type="button" style="margin-top:0">たたむ</button>
  </div>
  <div id="body">
    <label>音楽・動画ファイル(画面にドラッグ＆ドロップでもOK)<br /><input type="file" id="audioFile" /></label>
    <label>円の中の画像・動画(任意。動画を選んだ場合は映像だけ使います。未指定なら読み込んだ動画の映像)<br /><input type="file" id="imageFile" accept="image/*,video/*" /></label>
    <label>円の中に使う動画のリンク(YouTube / ニコニコ動画。映像だけ使い、音は鳴らしません)<br />
      <input type="url" id="linkInput" placeholder="https://www.youtube.com/watch?v=..." style="width:100%;box-sizing:border-box;margin-top:8px;font-size:16px;padding:6px" />
    </label>
    <div class="row"><button id="linkSet" type="button">リンクの映像を使う</button><button id="linkClear" type="button">解除</button></div>
    <div id="linkStatus" style="font-size:13px;color:var(--muted)"></div>
    <div class="row">
      <button id="startButton" type="button">再生開始</button>
      <button id="fsBtn" type="button">⛶ 全画面</button>
      <button id="recBtn" type="button">⏺ 録画開始</button>
    </div>
    <div id="exportBox" style="margin-top:10px;padding-top:8px;border-top:1px solid #555">
      <div style="font-size:14px;color:var(--muted)">⚡ 高速書き出し(再生せずに動画ファイルを作る)</div>
      <div class="row">
        <select id="expSize">
          <option value="1280x720">1280×720(横)</option>
          <option value="1920x1080">1920×1080(横)</option>
          <option value="1080x1920">1080×1920(縦)</option>
          <option value="1080x1080">1080×1080(正方形)</option>
          <option value="screen">今の画面と同じ比率</option>
        </select>
        <select id="expFps"><option value="30">30fps</option><option value="60">60fps</option></select>
      </div>
      <div class="row" style="font-size:14px;color:var(--muted);margin-top:6px">
        開始<input type="number" id="expStart" value="0" min="0" step="0.1" style="width:80px;font-size:16px" />秒
        終了<input type="number" id="expEnd" min="0" step="0.1" placeholder="最後まで" style="width:90px;font-size:16px" />秒
      </div>
      <div class="row"><button id="expBtn" type="button">⚡ 高速書き出し</button></div>
      <div id="expStatus" style="font-size:13px;color:var(--muted);margin-top:4px"></div>
    </div>
    <div id="status"></div>

    <div id="controls" class="hidden">
      <input type="range" id="seekBar" min="0" max="100" value="0" step="0.01" />
      <div id="timeDisplay">00:00 / 00:00</div>
      <div class="row">
        <button id="playPauseButton" type="button">▶️ 再生</button>
        <button id="loopBtn" type="button">🔁 リピート: オフ</button>
        <button id="muteBtn" type="button">🔊</button>
      </div>
      <label>音量<input type="range" id="volume" min="0" max="1" value="1" step="0.01" /></label>
    </div>

    <label>感度(バーの長さ)<input type="range" id="sens" min="0.3" max="1.5" value="1" step="0.05" /></label>
    <label>メリハリ(0で従来どおり。上げると、周りより目立つ音だけが高く跳ねる)<input type="range" id="punch" min="0" max="0.95" value="0.6" step="0.05" /></label>
    <label>バーの形<br />
      <select id="layout">
        <option value="circle">円形(円の周り)</option>
        <option value="line">横一列(縦に伸びる)</option>
      </select>
    </label>
    <label>バーの本数<input type="range" id="barCount" min="60" max="256" value="256" step="4" /></label>
    <label><input type="checkbox" id="fitRange" checked /> 動画の最高周波数を円の一周に合わせる</label>
    <label><input type="checkbox" id="spinOn" checked /> 円の中の画像・映像を回す</label>
    <label>回転の速さ:<span id="spinVal">10倍</span>(曲の最初から最後まででちょうど1周が1倍。マイナスで逆回転)<input type="range" id="spinSpeed" min="-60" max="60" value="10" step="1" /></label>
    <label>色テーマ<br />
      <select id="theme">
        <option value="rainbow">レインボー</option>
        <option value="fire">ファイア</option>
        <option value="ocean">オーシャン</option>
        <option value="mono">モノクロ</option>
        <option value="image">円の中の画像・映像の色に合わせる</option>
        <option value="avg">円の中の画像・映像の平均色</option>
        <option value="solid">好きな色(単色)</option>
      </select>
      <input type="color" id="barColor" value="#00e5ff" class="hidden" style="margin-top:8px;width:60px;height:36px;vertical-align:middle" />
    </label>
    <label>上下位置調整<input type="range" id="offsetY" min="-500" max="500" value="0" step="1" /></label>
    <label>左右位置調整<input type="range" id="offsetX" min="-500" max="500" value="0" step="1" /></label>
  </div>
</div>

<div id="embedWrap"><iframe id="embedFrame" title="circle video"></iframe></div>
<canvas id="visualizer"></canvas>
<video id="media" playsinline></video>

<script>
  const $ = id => document.getElementById(id);
  const media = $('media'), canvas = $('visualizer'), ctx = canvas.getContext('2d');
  const fileInput = $('audioFile'), imageInput = $('imageFile'), startButton = $('startButton');
  const seekBar = $('seekBar'), timeDisplay = $('timeDisplay'), playPauseButton = $('playPauseButton');
  const controls = $('controls'), statusEl = $('status');
  const offsetXInput = $('offsetX'), offsetYInput = $('offsetY');
  const sensInput = $('sens'), barCountInput = $('barCount'), themeInput = $('theme');
  const volumeInput = $('volume'), muteBtn = $('muteBtn'), loopBtn = $('loopBtn');
  const fsBtn = $('fsBtn'), recBtn = $('recBtn'), fitRange = $('fitRange'), punchInput = $('punch'), layoutInput = $('layout');
  const linkInput = $('linkInput'), linkSet = $('linkSet'), linkClear = $('linkClear'), linkStatus = $('linkStatus');
  const embedWrap = $('embedWrap'), embedFrame = $('embedFrame');
  const spinOn = $('spinOn'), spinSpeed = $('spinSpeed'), spinVal = $('spinVal'), barColorInput = $('barColor');

  const SHOW = 3000, FADE = 700;       // 進行リングの表示時間 / フェード時間(ms)
  const MAX_DECODE = 100 * 1024 * 1024, MAX_DECODE_SEC = 600; // これを超えるファイル/長さは事前解析せず、再生しながら範囲を広げる
  const THRESH_DB = -80;                // この大きさ以上の音が出ている周波数を「含まれている」とみなす
  const LIVE_TH = Math.round(255 * (THRESH_DB + 100) / 70); // analyserの既定(-100〜-30dB)での同じ値
  const SKIP_MS = 800; // 「+10」表示の長さ。この間にタップを続けると秒数が増えていく
  const SS = 64; // 色を拾うための小さな作業用キャンバス
  const SC = document.createElement('canvas'); SC.width = SC.height = SS;
  const sctx = SC.getContext('2d', { willReadFrequently: true });
  let solidRgb = [0, 229, 255], avgSmooth = null, lastPx = null, frameN = 0;
  const THEMES = {
    rainbow: t => [t * 360, 100, 50],
    fire: t => [t * 60, 100, 50],
    ocean: t => [170 + t * 90, 100, 55],
    mono: () => [0, 0, 90]
  };

  let audioCtx = null, analyser = null, gain = null, recDest = null, dataArray = null, pre = null;
  let loadToken = 0, fixedBins = 0, rangeFixed = false, liveMax = 32;
  let isUserSeeking = false, offsetX = 0, offsetY = 0, muted = false;
  let imageObj = null, barsInfo = [], hoveredBarIndex = -1, dpr = 1;
  let ring = { x: 0, y: 0, r: 0 }, ringDrag = false, ringAlpha = 0, lastTouch = -1e9;
  let recorder = null, chunks = [];
  let currentFile = null, exporting = false, exportCancel = false;

  spinSpeed.addEventListener('input', () => {
    const v = parseInt(spinSpeed.value, 10);
    spinVal.textContent = v === 0 ? '停止' : Math.abs(v) + '倍' + (v < 0 ? '(逆回転)' : '');
  });
  // ---- 色テーマの設定を覚えておく(次に開いたときに引き継ぐ) ----
  const SETTINGS_KEY = 'visualizer-color-settings';
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ theme: themeInput.value, barColor: barColorInput.value, loop: media.loop, layout: layoutInput.value })); } catch (e) {}
  }
  function applyBarColor() {
    const h = barColorInput.value;
    solidRgb = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  try {
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
    if (saved.theme && [...themeInput.options].some(o => o.value === saved.theme)) themeInput.value = saved.theme;
    if (/^#[0-9a-f]{6}$/i.test(saved.barColor || '')) barColorInput.value = saved.barColor;
    if (saved.layout === 'line') layoutInput.value = 'line';
    if (saved.loop === true) { media.loop = true; loopBtn.textContent = '🔁 リピート: オン'; }
  } catch (e) {}
  applyBarColor();
  barColorInput.classList.toggle('hidden', themeInput.value !== 'solid');
  themeInput.addEventListener('change', () => {
    barColorInput.classList.toggle('hidden', themeInput.value !== 'solid');
    saveSettings();
  });
  barColorInput.addEventListener('input', () => { applyBarColor(); saveSettings(); });
  layoutInput.addEventListener('change', saveSettings);
  offsetXInput.addEventListener('input', () => { offsetX = parseInt(offsetXInput.value, 10); });
  offsetYInput.addEventListener('input', () => { offsetY = parseInt(offsetYInput.value, 10); });

  $('togglePanel').addEventListener('click', () => {
    const body = $('body');
    body.classList.toggle('hidden');
    $('togglePanel').textContent = body.classList.contains('hidden') ? '開く' : 'たたむ';
  });

  let viewW = window.innerWidth, viewH = window.innerHeight;
  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect(); // 実際に表示されている大きさを基準にする(円がつぶれないように)
    viewW = r.width || window.innerWidth; viewH = r.height || window.innerHeight;
    canvas.width = Math.max(1, Math.round(viewW * dpr));
    canvas.height = Math.max(1, Math.round(viewH * dpr));
  }
  window.addEventListener('resize', resizeCanvas);
  if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(canvas);
  if (window.visualViewport) visualViewport.addEventListener('resize', resizeCanvas);
  document.addEventListener('fullscreenchange', resizeCanvas);
  resizeCanvas();

  // ---- 画像 ----
  let picVideo = null; // 円の中に使う動画(映像だけ。音は鳴らさない)
  function clearPic() {
    imageObj = null;
    if (picVideo) { picVideo.pause(); picVideo.removeAttribute('src'); picVideo.load(); picVideo.remove(); picVideo = null; }
  }
  function syncPic() { // 曲の再生・停止に合わせて動かす
    if (!picVideo) return;
    if (media.paused) picVideo.pause(); else picVideo.play().catch(() => {});
  }
  media.addEventListener('play', syncPic);
  media.addEventListener('pause', syncPic);
  media.addEventListener('seeked', () => { if (picVideo && picVideo.duration) picVideo.currentTime = media.currentTime % picVideo.duration; });
  function setImage(file) {
    clearPic();
    if (!file) return;
    if (file.type.startsWith('video/')) {
      picVideo = document.createElement('video');
      picVideo.muted = true; picVideo.loop = true; picVideo.playsInline = true; picVideo.preload = 'auto';
      picVideo.setAttribute('playsinline', '');
      picVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
      picVideo.src = URL.createObjectURL(file);
      document.body.appendChild(picVideo);
      syncPic();
      return;
    }
    const img = new Image();
    img.onload = () => { imageObj = img; };
    img.src = URL.createObjectURL(file);
  }
  // ---- リンク(YouTube / ニコニコ動画)の映像を円の中に使う ----
  // 外部サイトの映像は取り込めないため、公式の埋め込みプレーヤーを円形に切り抜いて、キャンバスの後ろに置いている
  let embed = null, embedR = 0, embedShown = false;
  function parseLink(u) {
    let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
    if (m) return { type: 'yt', id: m[1] };
    m = u.match(/(?:nicovideo\.jp\/watch\/|nico\.ms\/)((?:sm|nm|so)?\d+)/);
    if (m) return { type: 'nico', id: m[1] };
    return null;
  }
  function embedCmd(kind) { // kind: play | pause | mute
    if (!embed || !embedFrame.contentWindow) return;
    try {
      if (embed.type === 'yt') {
        const func = kind === 'play' ? 'playVideo' : kind === 'pause' ? 'pauseVideo' : 'mute';
        embedFrame.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: '' }), '*');
      } else {
        const send = (eventName, data) => embedFrame.contentWindow.postMessage({ playerId: '1', sourceConnectorType: 1, eventName, data }, 'https://embed.nicovideo.jp');
        if (kind === 'mute') { send('mute', { mute: true }); send('volumeChange', { volume: 0 }); }
        else send(kind);
      }
    } catch (e) {}
  }
  function syncEmbed() { if (embed && media.src) embedCmd(media.paused ? 'pause' : 'play'); } // 曲の再生・停止に合わせる
  media.addEventListener('play', syncEmbed);
  media.addEventListener('pause', syncEmbed);
  function placeEmbed() {
    if (!embed) { if (embedShown) { embedWrap.style.display = 'none'; embedShown = false; } return; }
    const w = viewW, h = viewH, r = Math.min(w, h) / 6;
    const ang = media.src && isFinite(media.duration) && media.duration && spinOn.checked
      ? (media.currentTime / media.duration) * Math.PI * 2 * parseFloat(spinSpeed.value) : 0;
    if (!embedShown) { embedWrap.style.display = 'block'; embedShown = true; }
    if (embedR !== r) {
      embedWrap.style.width = embedWrap.style.height = (r * 2) + 'px';
      embedFrame.style.transform = 'translate(-50%, -50%) scale(' + (r * 2) / 360 + ')';
      embedR = r;
    }
    embedWrap.style.transform = 'translate(' + (w / 2 + offsetX - r) + 'px, ' + (h / 2 + offsetY - r) + 'px) rotate(' + ang + 'rad)';
  }
  linkSet.addEventListener('click', () => {
    const info = parseLink(linkInput.value.trim());
    if (!info) { linkStatus.textContent = 'YouTube か ニコニコ動画 のリンクを入力してください'; return; }
    embed = info; embedR = 0;
    embedFrame.referrerPolicy = 'strict-origin-when-cross-origin';
    embedFrame.allow = 'autoplay; encrypted-media';
    const origin = /^https?:$/.test(location.protocol) ? '&origin=' + encodeURIComponent(location.origin) : '';
    embedFrame.src = info.type === 'yt'
      ? 'https://www.youtube.com/embed/' + info.id + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + info.id +
        '&playsinline=1&modestbranding=1&rel=0&disablekb=1&fs=0&iv_load_policy=3&enablejsapi=1' + origin
      : 'https://embed.nicovideo.jp/watch/' + info.id + '?jsapi=1&playerId=1&autoplay=1';
    embedFrame.onload = () => [1200, 3000].forEach(ms => setTimeout(() => { embedCmd('mute'); syncEmbed(); }, ms));
    linkStatus.textContent = location.protocol === 'file:' && info.type === 'yt'
      ? '読み込み中…(このHTMLをファイルとして直接開いていると、YouTubeが表示されない(エラー153)ことがあります。その場合はWebサーバー上で開いてください)'
      : '読み込み中…(映像が出ない場合は、公開されている動画か、埋め込みが許可されているかを確認してください)';
  });
  linkClear.addEventListener('click', () => {
    embed = null; embedFrame.src = 'about:blank'; linkStatus.textContent = '';
  });

  imageInput.addEventListener('change', e => setImage(e.target.files[0]));

  // ---- オーディオ構築(1回だけ) ----
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    pre = new Float32Array(dataArray.length + 1);
    gain = audioCtx.createGain();
    recDest = audioCtx.createMediaStreamDestination();
    const src = audioCtx.createMediaElementSource(media);
    src.connect(analyser);
    analyser.connect(gain); gain.connect(audioCtx.destination);
    analyser.connect(recDest); // 録画は音量・ミュートの影響を受けない
  }

  // ---- 読み込み ----
  async function loadMedia(file) {
    initAudio();
    currentFile = file;
    audioCtx.resume();
    const token = ++loadToken;
    fixedBins = 0; rangeFixed = false; liveMax = 32;
    if (media.dataset.url) URL.revokeObjectURL(media.dataset.url);
    const url = URL.createObjectURL(file);
    media.dataset.url = url;
    media.preload = 'auto';
    media.src = url;
    media.load();
    statusEl.textContent = '読み込み中…';
    try {
      await new Promise((res, rej) => {
        const events = ['loadedmetadata', 'loadeddata', 'canplay'];
        const cleanup = () => {
          clearTimeout(timer);
          events.forEach(ev => media.removeEventListener(ev, done));
          media.removeEventListener('error', fail);
        };
        const done = () => { cleanup(); res(); };
        const fail = () => { cleanup(); rej(new Error(media.error ? 'エラーコード ' + media.error.code : '形式が未対応の可能性があります')); };
        const timer = setTimeout(() => {
          cleanup();
          if (isFinite(media.duration) && media.duration > 0) res(); else rej(new Error('読み込みがタイムアウトしました'));
        }, 10000);
        events.forEach(ev => media.addEventListener(ev, done));
        media.addEventListener('error', fail);
      });
    } catch (err) {
      statusEl.textContent = 'このファイルは読み込めませんでした(' + err.message + ')';
      return;
    }
    statusEl.textContent = file.name;
    seekBar.max = media.duration; seekBar.value = 0;
    controls.classList.remove('hidden');
    media.play().catch(() => {});
    analyseRange(file, token);
  }

  // ---- 動画に含まれる最高周波数を調べる(円の一周の端にそろえるため) ----
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = i + k + len / 2;
          const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
          const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
        }
      }
    }
  }
  async function analyseRange(file, token) {
    if (file.size > MAX_DECODE || !(media.duration <= MAX_DECODE_SEC)) return;
    let ac;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const buf = await ac.decodeAudioData(await file.arrayBuffer());

    hoveredBarIndex = -1;
    for (let i = 0; i < barsInfo.length; i++) {
      const b = barsInfo[i];
      const dx = mx - b.x, dy = my - b.y;
      const cos = Math.cos(-b.angle), sin = Math.sin(-b.angle);
      const lx = dx * cos - dy * sin, ly = dx * sin + dy * cos;
      if (lx >= 0 && lx <= b.width && ly >= -b.height / 2 - 2 && ly <= b.height / 2 + 2) { hoveredBarIndex = i; break; }
    }
  });
  canvas.addEventListener('pointerleave', () => { hoveredBarIndex = -1; });

  // ---- 描画 ----
  function draw() {
    requestAnimationFrame(draw);
    placeEmbed();
    if (exporting) return; // 書き出し中は画面の描画を止める
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dur = media.duration;
    if (!analyser || !media.src || !isFinite(dur) || !dur) return;
    analyser.getByteFrequencyData(dataArray);
    const tNow = isUserSeeking ? parseFloat(seekBar.value) : media.currentTime;
    if (!isUserSeeking) { seekBar.value = tNow; updateTimeDisplay(tNow); }
    renderFrame(ctx, tNow, viewW, viewH, canvas.width / viewW, false);
  }
  // 1フレーム分の描画(画面表示と書き出しで共通)。dataArray に周波数データが入っている前提
  function renderFrame(ctx, tNow, w, h, dpr, off) {
    const dur = media.duration;
    ctx.scale(dpr, dpr);
    const p = Math.min(tNow / dur, 1);
    const centerX = w / 2 + offsetX, centerY = h / 2 + offsetY;
    const radius = Math.min(w, h) / 6;
    ring = { x: centerX, y: centerY, r: radius - 10, br: Math.max(22, (radius - 10) * 0.3) };

    const age = performance.now() - lastTouch;
    ringAlpha = off ? 0 : age < SHOW ? 1 : Math.max(0, 1 - (age - SHOW) / FADE);

    frameN++;
    const spinAngle = spinOn.checked ? (tNow / dur) * Math.PI * 2 * parseFloat(spinSpeed.value) : 0;
    let px = null; // 円の縁の色を拾うためのピクセル
    // 円の中:画像 > 動画の映像
    const src = embed ? null : (imageObj || (picVideo && picVideo.videoWidth ? picVideo : null) || (media.videoWidth ? media : null)); // リンクの映像はキャンバスの後ろに表示
    if (src) {
      const sw = src.videoWidth || src.width, sh = src.videoHeight || src.height;
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.clip();
      const scale = Math.max((radius * 2) / sw, (radius * 2) / sh);
      const dw = sw * scale, dh = sh * scale;
      if (spinOn.checked) { // 回転角は曲の再生位置に連動(停止すれば止まり、シークすれば追従)
        ctx.translate(centerX, centerY);
        ctx.rotate(spinAngle);
        ctx.translate(-centerX, -centerY);
      }
      ctx.drawImage(src, centerX - dw / 2, centerY - dh / 2, dw, dh);
      ctx.restore();
      if (themeInput.value === 'image' || themeInput.value === 'avg') {
        if (frameN % 3 === 0 || !lastPx) { // 色の変化はゆっくりなので3フレームに1回で十分
          try {
            const k = Math.max(SS / sw, SS / sh);
            sctx.drawImage(src, SS / 2 - sw * k / 2, SS / 2 - sh * k / 2, sw * k, sh * k);
            lastPx = sctx.getImageData(0, 0, SS, SS).data;
          } catch (e) { lastPx = null; }
        }
        px = lastPx;
      }
    }

    // バー:普通のビジュアライザー(周波数スペクトルが円の周りで跳ねる)
    const B = parseInt(barCountInput.value, 10), step = (Math.PI * 2) / B;
    const bins = dataArray.length, sens = parseFloat(sensInput.value);
    if (!rangeFixed) for (let k = bins - 1; k >= liveMax; k--) if (dataArray[k] > LIVE_TH) { liveMax = k + 1; break; }
    for (let k = 0; k < bins; k++) pre[k + 1] = pre[k] + dataArray[k]; // 周囲の平均を素早く出すための累積和
    const punch = parseFloat(punchInput.value), W = 12;
    const R = fitRange.checked ? Math.min(bins, rangeFixed ? fixedBins : liveMax) : bins; // 円に割り当てる周波数の範囲
    const line = layoutInput.value === 'line'; // 横一列:画面の下に横並びで、縦に伸びる
    const spacing = (w * 0.92) / B, baseY = h * 0.9 + offsetY;
    const barWidth = line ? Math.max(1, spacing * 0.6) : 2, inner = 4;
    const theme = THEMES[themeInput.value] || THEMES.rainbow;
    const mode = themeInput.value;
    const lighten = (c, on) => on ? c.map(v => v + (255 - v) * 0.4) : c;
    const rgbStr = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
    let avgC = null;
    if (mode === 'avg' && px) { // 円の中全体の平均色(映像は滑らかに色が移り変わる)
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = 0; y < SS; y += 2) for (let x = 0; x < SS; x += 2) {
        if (Math.hypot(x - SS / 2, y - SS / 2) > SS / 2) continue;
        const o = (y * SS + x) * 4; r += px[o]; g += px[o + 1]; b += px[o + 2]; n++;
      }
      let c = [r / n, g / n, b / n];
      const m = Math.max(c[0], c[1], c[2]);
      c = m < 24 ? [200, 200, 200] : c.map(v => v * 230 / m);
      avgSmooth = avgSmooth ? avgSmooth.map((v, i) => v + (c[i] - v) * 0.15) : c;
      avgC = avgSmooth;
    }
    barsInfo = [];

    for (let i = 0; i < B; i++) {
      // 最後のバー(一周の1本手前)が、動画に含まれる最高周波数
      const f = (i / (B - 1)) * (R - 1), lo = Math.floor(f), hi = Math.min(R - 1, lo + 1), fr = f - lo;
      let v = dataArray[lo] * (1 - fr) + dataArray[hi] * fr;
      if (R > B) {
        const a = Math.floor(i * R / B), b = Math.max(a + 1, Math.floor((i + 1) * R / B));
        v = 0;
        for (let k = a; k < b; k++) if (dataArray[k] > v) v = dataArray[k];
      }
      // 周囲(前後W本)の平均より突き出た分だけを高さにする
      const kc = Math.min(R - 1, Math.round(f));
      const lo2 = Math.max(0, kc - W), hi2 = Math.min(R, kc + W + 1);
      const base = punch * (pre[hi2] - pre[lo2]) / (hi2 - lo2);
      const boosted = Math.pow(Math.max(0, v - base) / Math.max(1, 255 - base), 0.5);
      const barLength = Math.max(boosted * (line ? h * 0.3 : radius * 1.8) * sens, 10);
      const angle = line ? -Math.PI / 2 : i * step;
      const bx = line ? w * 0.04 + (i + 0.5) * spacing : centerX + Math.cos(angle) * (radius - inner);
      const by = line ? baseY : centerY + Math.sin(angle) * (radius - inner);
      const hv = !off && i === hoveredBarIndex;
      let fill;
      if (mode === 'image' && px) {
        // 回転後の画像の、このバーの真下あたり(縁)の色。暗い所でも見えるよう明るさをそろえる
        const ang = angle - spinAngle;
        const x = line ? Math.round(i / (B - 1) * (SS - 1)) : Math.min(SS - 1, Math.max(0, Math.round(SS / 2 + Math.cos(ang) * SS * 0.45)));
        const y = line ? SS >> 1 : Math.min(SS - 1, Math.max(0, Math.round(SS / 2 + Math.sin(ang) * SS * 0.45)));
        const o = (y * SS + x) * 4;
        let c = [px[o], px[o + 1], px[o + 2]];
        const m = Math.max(c[0], c[1], c[2]);
        c = m < 24 ? [200, 200, 200] : c.map(v => v * 230 / m);
        fill = rgbStr(lighten(c, hv));
      } else if (mode === 'avg' && avgC) {
        fill = rgbStr(lighten(avgC, hv));
      } else if (mode === 'solid') {
        fill = rgbStr(lighten(solidRgb, hv));
      } else {
        const [hue, sat, light] = theme(i / B);
        fill = `hsl(${hue}, ${sat}%, ${hv ? Math.min(100, light + 25) : light}%)`;
      }

      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(angle);
      ctx.fillStyle = fill;
      ctx.fillRect(0, -barWidth / 2, barLength, barWidth);
      ctx.restore();

      barsInfo[i] = { x: bx, y: by, width: barLength, height: barWidth, angle };
    }

    // 進行リング(触ったときだけ表示)
    if (ringAlpha > 0) {
      const start = -Math.PI / 2;
      ctx.save();
      ctx.globalAlpha = ringAlpha;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.arc(centerX, centerY, ring.r, 0, Math.PI * 2);
      ctx.stroke();
      if (p > 0) {
        ctx.strokeStyle = '#fff';
        ctx.beginPath();
        ctx.arc(centerX, centerY, ring.r, start, start + Math.PI * 2 * p);
        ctx.stroke();
      }
      // 中央の再生/一時停止マーク(YouTube風・控えめ)
      const br = ring.br, u = br * 0.42;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.arc(centerX, centerY, br, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      if (media.paused) {
        ctx.beginPath();
        ctx.moveTo(centerX - u * 0.6, centerY - u); ctx.lineTo(centerX + u, centerY); ctx.lineTo(centerX - u * 0.6, centerY + u);
        ctx.closePath(); ctx.fill();
      } else {
        const bw = u * 0.55;
        ctx.fillRect(centerX - u * 0.85, centerY - u, bw, u * 2);
        ctx.fillRect(centerX + u * 0.85 - bw, centerY - u, bw, u * 2);
      }
      ctx.restore();
    }
    // 連打で「+10 → +20 → +30」と秒数が積み上がっていく表示(新しい数字がポンと弾む)
    if (skipFx && !off) {
      const el = performance.now() - skipFx.t;
      if (el > SKIP_MS) skipFx = null;
      else {
        const fade = Math.min(1, (SKIP_MS - el) / 400);
        const roll = Math.min(1, el / 180), ease = 1 - Math.pow(1 - roll, 3);
        const dir = skipFx.dir, cx = ring.x + dir * ring.r * 0.5, cy = ring.y;
        const fs = Math.max(13, ring.r * 0.3), sign = dir > 0 ? '+' : '−';
        ctx.save();
        ctx.fillStyle = '#fff';
        ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 6;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        // 進む向きを示す三角(順番に光る)
        const u = ring.r * 0.07;
        for (let i = 0; i < 3; i++) {
          const k = dir > 0 ? i : 2 - i;
          ctx.globalAlpha = fade * (0.3 + 0.7 * Math.max(0, 1 - Math.abs(el / 200 - k * 0.5)));
          const tx = cx + (i - 1) * u * 2.6, ty = cy - ring.r * 0.32;
          ctx.beginPath();
          ctx.moveTo(tx - dir * u, ty - u); ctx.lineTo(tx + dir * u, ty); ctx.lineTo(tx - dir * u, ty + u);
          ctx.closePath(); ctx.fill();
        }
        // 数字:古い数字は残さず、新しい数字だけをポンと弾ませて表示
        ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
        const pop = 1 + 0.25 * (1 - ease);
        ctx.globalAlpha = fade;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(pop, pop);
        ctx.fillText(sign + skipFx.total, 0, 0);
        ctx.restore();
        ctx.globalAlpha = fade * 0.9;
        ctx.font = 'bold ' + fs * 0.45 + 'px system-ui, sans-serif';
        ctx.fillText('秒', cx, cy + fs * 0.75);
        ctx.restore();
      }
    }
  }
  draw();

  function formatTime(s) {
    s = Math.max(0, s || 0);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }
  function updateTimeDisplay(t) {
    if (!isFinite(media.duration)) return;
    timeDisplay.textContent = formatTime(t) + ' / ' + formatTime(media.duration);
  }
</script>
</body>
</html>
